name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read Node.js version
        id: node
        uses: $/.github/actions/read-node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51

      - name: Run Biome
        run: biome ci .

      - name: Validate skills
        run: pnpm validate:skills

      - name: Build
        run: pnpm build

      - name: Validate lockfile
        run: pnpm lint:lockfile


  react-doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Node.js version
        id: node
        uses: $/.github/actions/read-node-version

      - name: Read catalog react-doctor version
        id: catalog
        run: |
          version="$(node -e '
            const text = require("fs").readFileSync("pnpm-workspace.yaml", "utf8");
            const match = text.match(/^\s*"?react-doctor"?\s*:\s*"?([^"\s#]+)"?/m);
            if (!match) {
              console.error("react-doctor missing from pnpm-workspace.yaml catalog");
              process.exit(1);
            }
            process.stdout.write(match[1]);
          ')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Run React Doctor
        uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e
        with:
          version: ${{ steps.catalog.outputs.version }}
          blocking: error
          node-version: ${{ steps.node.outputs.version }}